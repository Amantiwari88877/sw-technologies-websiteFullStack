<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — SW Technologies</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 5% 60px;background:var(--navy)}
    .auth-card{background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:3rem;width:100%;max-width:480px}
    .auth-logo{text-align:center;margin-bottom:2rem}
    .auth-card h2{font-family:var(--font-head);font-size:1.8rem;font-weight:800;margin-bottom:0.4rem;text-align:center}
    .auth-card .sub{color:var(--gray);font-size:0.92rem;text-align:center;margin-bottom:2rem}
    .api-err{background:rgba(255,82,82,0.08);border:1px solid rgba(255,82,82,0.3);border-radius:10px;padding:0.9rem 1.1rem;color:#FF5252;font-size:0.88rem;margin-bottom:1rem;display:none}
    .api-err.show{display:block}
    .auth-footer{text-align:center;margin-top:1.5rem;color:var(--gray);font-size:0.9rem}
    .auth-footer a{color:var(--accent);text-decoration:none;font-weight:600}
    .auth-footer a:hover{text-decoration:underline}
    .pass-hint{font-size:0.78rem;color:var(--gray);margin-top:0.3rem}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">SW<span>.</span>Tech</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li><li><a href="contact.html" class="nav-cta">Contact Us</a></li>
  </ul>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><a href="index.html" class="logo">SW<span>.</span>Tech</a></div>
    <h2>Create Account</h2>
    <p class="sub">Join SW Technologies — it's free</p>
    <div class="api-err" id="apiErr"></div>
    <form id="regForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="rname" placeholder="Rahul Sharma" required/><div class="field-error" id="rname-err"></div></div>
      <div class="form-group"><label>Email Address</label><input type="email" id="remail" placeholder="you@example.com" required/><div class="field-error" id="remail-err"></div></div>
      <div class="form-group">
        <label>Password</label><input type="password" id="rpass" placeholder="Min. 6 characters" required/>
        <div class="pass-hint">At least 6 characters</div>
        <div class="field-error" id="rpass-err"></div>
      </div>
      <button type="submit" id="regBtn" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.75rem">Create Account →</button>
    </form>
    <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
    <div class="auth-footer" style="margin-top:0.75rem"><a href="index.html">← Back to Home</a></div>
  </div>
</div>
<script src="main.js"></script><script src="api.js"></script>
<script>
if(getUser()) window.location.href='index.html';
document.getElementById('regForm').addEventListener('submit',async e=>{
  e.preventDefault();
  document.querySelectorAll('.field-error').forEach(el=>{el.textContent='';el.style.display='none'});
  document.getElementById('apiErr').classList.remove('show');
  const btn=document.getElementById('regBtn');btn.textContent='Creating account…';btn.disabled=true;
  const r=await apiFetch('/auth/register',{method:'POST',body:JSON.stringify({
    name:document.getElementById('rname').value.trim(),
    email:document.getElementById('remail').value.trim(),
    password:document.getElementById('rpass').value
  })});
  btn.textContent='Create Account →';btn.disabled=false;
  if(r.ok){
    setAuth(r.data.token,r.data.user);
    window.location.href='index.html';
  } else if(r.data.errors){
    r.data.errors.forEach(er=>{
      const map={name:'rname-err',email:'remail-err',password:'rpass-err'};
      const el=document.getElementById(map[er.path]);
      if(el){el.textContent=er.msg;el.style.display='block'}
    });
  } else {
    const err=document.getElementById('apiErr');
    err.textContent=r.data.error||'Registration failed. Please try again.';
    err.classList.add('show');
  }
});
</script>
</body>
</html>
